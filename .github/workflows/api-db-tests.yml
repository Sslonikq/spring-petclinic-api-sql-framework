name: API + DB tests

on:
    push:
        branches:
            ["main"]
    pull_request:
        branches:
            ["main"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Code_Quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: pyproject.toml

            - name: Install lint dependencies
              run: |
                python -m pip install --upgrade pip
                pip install --group lint

            - name: ruff check
              run: ruff check .

            - name: ruff format
              run: ruff format --check .

    tests:
        needs: Code_Quality
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - db_engine: "postgres"
                      db_port: 5432
                    - db_engine: "mysql"
                      db_port: 3306
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: pyproject.toml

            - name: Install test dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install --group dev

            - name: Create .env for ${{ matrix.db_engine }}
              run: |
                  cp .env.example .env
                  sed -i "s/^DB_ENGINE=.*/DB_ENGINE=${{ matrix.db_engine }}/" .env
                  sed -i "s/^DB_PORT=.*/DB_PORT=${{ matrix.db_port }}/" .env

            - name: Start PetClinic and database
              run: docker compose up -d --wait

            - name: Wait until PetClinic is ready
              run: |
                  for i in $(seq 1 40); do
                    code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9966/petclinic/api/owners || true)
                    [ "$code" = "200" ] && exit 0
                    sleep 3
                  done
                  echo "PetClinic did not start"
                  exit 1

            - name: Run API and DB tests
              run: pytest

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-${{ matrix.db_engine }}
                  path: allure-results

            - name: Print stand logs on failure
              if: failure()
              run: docker compose logs --no-color

            - name: Stop stand and remove volumes
              if: always()
              run: docker compose --profile "*" down -v

    allure-report:
        name: Publish Allure report
        needs: tests
        if: ${{ !cancelled() && needs.tests.result != 'skipped' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download Allure results
              uses: actions/download-artifact@v4
              with:
                  name: allure-results-postgres
                  path: allure-results

            - name: Check out previous report history
              uses: actions/checkout@v4
              continue-on-error: true
              with:
                  ref: gh-pages
                  path: gh-pages

            - name: Restore report history
              run: cp -r gh-pages/history allure-results/ 2>/dev/null || true

            - name: Install Allure CLI
              run: npm install -g allure-commandline

            - name: Generate Allure report
              run: allure generate allure-results -o allure-report --clean

            - name: Deploy report to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              if: github.ref == 'refs/heads/main'
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./allure-report
                  publish_branch: gh-pages

            - name: Upload Allure report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: allure-report
                  path: allure-report
