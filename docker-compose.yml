name: petclinic

services:
  postgres:
    image: postgres:16.4
    container_name: petclinic-postgres
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  petclinic:
    image: springcommunity/spring-petclinic-rest:4.0.2
    container_name: petclinic-api
    profiles: [postgres]
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASS: ${DB_PASSWORD}
    ports:
      - "9966:9966"
    depends_on:
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: petclinic-mysql
    profiles: [mysql]
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  petclinic-mysql:
    image: springcommunity/spring-petclinic-rest:4.0.2
    container_name: petclinic-api-mysql
    profiles: [mysql]
    environment:
      SPRING_PROFILES_ACTIVE: mysql,spring-data-jpa
      MYSQL_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASS: ${DB_PASSWORD}
    ports:
      - "9966:9966"
    depends_on:
      mysql:
        condition: service_healthy
